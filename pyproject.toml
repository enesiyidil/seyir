[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "seyir"
version = "0.1.0"
description = "Mac’te e-posta takibi, Cursor oturumları ve Telegram üzerinden Türkçe sesli masaüstü kontrolü."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{ name = "Enes İYİDİL" }]
dependencies = [
  "python-telegram-bot>=21.6,<23",
]

[project.scripts]
seyir = "bildirim.__main__:main"
bildirim = "bildirim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bildirim = ["panel/*.html", "panel/*.js"]
