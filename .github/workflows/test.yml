name: Seyir macOS tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: seyir --help
      - run: python -m seyir --help
      - run: bildirim --help
      - run: python -m unittest discover -s tests -v
      - run: |
          for script in scripts/*.sh; do zsh -n "$script"; done
          swiftc -parse-as-library -typecheck scripts/cursor-window-stream.swift
          for source in scripts/screen_helper.swift scripts/speech.swift scripts/voice_input.swift; do swiftc -typecheck "$source"; done
          node --check src/bildirim/panel/desk.js
          node --check src/bildirim/panel/speech-gate.js
